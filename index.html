<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>CEU Service Logger</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
:root{color-scheme:light;--navy:#0b2e4f;--gold:#f2b134;--sea:#12a3a0;--coral:#ef6a5b;--bg:#eaf0f6;--card:#fff;--ink:#0f1f33;--mute:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,b{font-family:'Sora',sans-serif}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.hide{display:none!important}
.alert{background:#fde0dc;color:#a8362a;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:14px}
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--navy);color:#cfe0f1;padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px 26px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;color:#fff;font-size:15px}
.brand small{font-size:12px;opacity:.7}
.side nav{display:grid;gap:4px}
.side nav button{display:flex;gap:12px;align-items:center;background:none;border:0;color:inherit;font:inherit;padding:11px 12px;border-radius:12px;cursor:pointer;text-align:left}
.side nav button:hover{background:rgba(255,255,255,.07)}
.side nav button.on{background:var(--gold);color:var(--navy);font-weight:600}
.side svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:26px 30px 40px;min-width:0;max-width:1300px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.head h1{margin:0;font-size:26px}
.head p{margin:2px 0 0;color:var(--mute)}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.del{color:#a8362a}
.filters{background:var(--card);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:16px}
label{display:flex;flex-direction:column;font-size:12px;font-weight:500;color:var(--mute);gap:4px}
input,select,textarea{font:inherit;color:var(--ink);background:#f6f9fc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:26px 32px;display:grid;grid-template-columns:auto 1fr;gap:38px;align-items:center;margin-bottom:14px}
.big{font:600 78px/1 'Sora',sans-serif;color:var(--gold)}
.lbl{opacity:.8;margin-top:8px}
.seg{display:flex;gap:2px;height:14px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.14)}
.seg i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--card);border-radius:16px;margin-bottom:14px;overflow:hidden}
.strip>div{padding:16px 20px;border-left:1px solid var(--line)}
.strip>div:first-child{border-left:0}
.strip b{display:block;font-size:30px;font-weight:600}
.strip span{color:var(--mute);font-size:13px}
.strip em{display:block;font-style:normal;font-size:12px;color:var(--sea)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.panel{background:var(--card);border-radius:16px;padding:18px}
.panel h2{font-size:15px;margin:0 0 12px;font-weight:600}
.panel.wide{grid-column:1/-1}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:170px}
th{color:var(--mute);font-weight:500;font-size:12.5px}
tbody tr:hover{background:#f6f9fc}
.up{color:var(--sea)}.down{color:#a8362a}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:500}
.Awaiting-repair{background:#fdf0d2;color:#8a5a00}
.In-repair{background:#dcecfa;color:#1e5a94}
.Repaired{background:#d3f3ef;color:#0b6b64}
.Dispatched{background:var(--navy);color:#fff}
.Beyond-repair{background:#fde0dc;color:#a8362a}
.tag.Return{background:#e6e0fa;color:#4b3aa8;border:0;cursor:pointer;font-family:inherit}
.hint{background:#fdf0d2;color:#8a5a00;border-radius:10px;padding:9px 12px;font-size:13px}
.hint:empty{display:none}
#imp{width:min(840px,94vw)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stream{font:inherit;text-align:left;color:#fff;background:#1b4670;border:0;border-radius:22px;padding:20px 24px;cursor:pointer;box-shadow:inset 0 0 0 2px transparent;transition:background .15s}
.stream:hover{background:#15385e}
.stream.on{background:var(--navy);box-shadow:inset 0 0 0 2px var(--gold)}
.stream .nm{font-size:13px;font-weight:500;opacity:.8}
.stream .big{font-size:54px;margin:4px 0 2px}
.stream .lbl{margin:0 0 12px;font-size:13.5px;opacity:.85}
.stream .sub{font-size:12.5px;opacity:.75;margin-top:8px}
@media(max-width:860px){.trio{grid-template-columns:1fr}.stream .big{font-size:44px}}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.empty{color:var(--mute);padding:28px;text-align:center}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--ink);width:min(580px,94vw);padding:22px;box-shadow:0 24px 60px rgba(11,46,79,.3)}
dialog::backdrop{background:rgba(11,46,79,.5);backdrop-filter:blur(3px)}
dialog form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog .full{grid-column:1/-1}
.loginwrap{min-height:100vh;background:var(--navy);display:grid;place-items:center;padding:20px}
.logincard{background:var(--card);border-radius:22px;padding:28px;width:min(360px,100%);display:grid;gap:12px}
.logincard h1{margin:0;font-size:22px}
@media(max-width:860px){
 #app{display:block}
 .side{position:fixed;inset:auto 0 0 0;height:auto;padding:6px;z-index:20}
 .brand{display:none}
 .side nav{grid-auto-flow:column;grid-auto-columns:1fr}
 .side nav button{flex-direction:column;gap:2px;font-size:12px;padding:7px;text-align:center}
 main{padding:18px 14px 100px}
 .hero{grid-template-columns:1fr;gap:18px;padding:22px}
 .big{font-size:60px}
 dialog form{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="login" class="loginwrap hide">
  <div class="logincard">
    <h1>CEU Service Logger</h1>
    <label>Email<input id="em" type="email" autocomplete="username"></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
    <button class="btn gold" onclick="signIn()">Sign in</button>
    <div id="lerr" style="color:#a8362a"></div>
  </div>
</div>

<div id="app" class="hide">
<aside class="side">
  <div class="brand">
    <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="#f2b134"/><path d="M16 8v16M8 16h16" stroke="#0b2e4f" stroke-width="4" stroke-linecap="round"/></svg>
    <div><b>CEU Equipment</b><small>Western Region</small></div>
  </div>
  <nav>
    <button data-t="dash" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6V4h-6zM4 20h6v-3H4z"/></svg>Summary</button>
    <button data-t="svc"><svg class="i" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Servicing</button>
    <button data-t="ppm"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>PPM</button>
    <button data-t="trn"><svg class="i" viewBox="0 0 24 24"><path d="M3 9l9-5 9 5-9 5zM7 12v4c0 1 2.2 2.5 5 2.5s5-1.5 5-2.5v-4"/></svg>User Trainings</button>
  </nav>
</aside>
<main>
  <div class="head">
    <div><h1 id="ttl">Summary</h1><p id="sub"></p></div>
    <button class="btn" onclick="sb.auth.signOut()">Exit</button>
  </div>
  <div id="err" class="alert hide"></div>
  <div class="filters">
    <label>Year<select id="f_y"></select></label>
    <label>District<select id="f_d"></select></label>
    <label>Facility type<select id="f_t"></select></label>
    <label>Facility<select id="f_fac"></select></label>
    <label>From<input id="f_from" type="date"></label>
    <label>To<input id="f_to" type="date"></label>
    <label id="f_s_wrap">Status<select id="f_s"></select></label>
    <label id="f_q_wrap" class="hide">Quarter<select id="f_q"></select></label>
    <label>&nbsp;<button class="btn" onclick="resetF()">Clear filters</button></label>
  </div>

  <section id="dash">
    <div class="trio" id="hero"></div>
    <div class="strip" id="strip"></div>
    <div class="charts">
      <div class="panel"><h2 id="h_a"></h2><canvas id="c_dist"></canvas></div>
      <div class="panel"><h2 id="h_b"></h2><canvas id="c_type"></canvas></div>
      <div class="panel"><h2 id="h_c"></h2><canvas id="c_third"></canvas></div>
      <div class="panel wide"><h2 id="h_d"></h2><canvas id="c_yoy" height="100"></canvas></div>
      <div class="panel wide"><h2>All work, year on year</h2><canvas id="c_all" height="70"></canvas><div class="tw" id="ytab" style="margin-top:14px"></div></div>
    </div>
  </section>

  <section id="svc" class="hide">
    <div class="bar"><button class="btn gold" onclick="openForm('service_records')">Add equipment</button><button class="btn" onclick="$('xl').click()">Import from Excel</button><button class="btn" onclick="downloadTemplate()">Download template</button><button class="btn" onclick="csv('service_records')">Export CSV</button><input type="file" id="xl" accept=".xlsx" class="hide" onchange="pickFile(event)"></div>
    <div class="panel tw" id="svc_t"></div>
  </section>

  <section id="trn" class="hide">
    <div class="bar"><button class="btn gold" onclick="openForm('trainings')">Add training</button><button class="btn" onclick="csv('trainings')">Export CSV</button></div>
    <div class="panel tw" id="trn_t"></div>
  </section>
  <section id="ppm" class="hide">
    <div class="bar"><button class="btn gold" onclick="openForm('ppm_records')">Add PPM</button><button class="btn" onclick="$('xlp').click()">Import from Excel</button><button class="btn" onclick="downloadTemplate('ppm_records')">Download template</button><button class="btn" onclick="exportPDF()">Export as PDF</button><input type="file" id="xlp" accept=".xlsx" class="hide" onchange="pickFile(event,'ppm_records')"></div>
    <div class="panel tw" id="ppm_t"></div>
  </section>
</main>
</div>

<datalist id="fac_list"></datalist>
<dialog id="imp"></dialog>
<dialog id="dlg"><form id="frm" onsubmit="save(event)"></form></dialog>

<script>
// 1. Paste your Supabase project values (Project Settings > API)
const SUPABASE_URL='https://gxudvqrreuywbtafndxb.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4dWR2cXJyZXV5d2J0YWZuZHhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NzkxMDYsImV4cCI6MjExMDA1NTEwNn0.Gl7LLXgUzlFEgKFRTT64iJmdlXK6r9FV8Tq9vb8OIGk';

// 2. Edit these lists as needed. Facilities are not listed here: they build themselves from the records you enter.
const DISTRICTS=['Ahanta West','Effia-Kwesimintsim','Ellembelle','Jomoro','Mpohor','Nzema East','Prestea-Huni Valley','Sekondi-Takoradi','Shama','Tarkwa-Nsuaem','Wassa Amenfi Central','Wassa Amenfi East','Wassa Amenfi West','Wassa East'];
const TYPES=['CHPS','Health Centre','Clinic','Polyclinic','District Hospital','Municipal Hospital','Regional Hospital','Other'];
const STATUS=['Awaiting repair','In repair','Repaired','Dispatched','Beyond repair'];
const SC=['#f2b134','#6cb4ee','#2ec4b6','#ffffff','#ef6a5b'];

const FIELDS={
 service_records:[['date_received','Date received','date',1],['facility','Facility','fac',1],['facility_type','Facility type',TYPES],['district','District',DISTRICTS],['equipment','Equipment','text',1],['manufacturer','Manufacturer','text'],['model','Model','text'],['serial_number','Serial number','text'],['status','Status',STATUS],['problem','Problem','area'],['part_replaced','Part replaced','text'],['date_dispatched','Date dispatched','date'],['comments','Comments','area']],
 trainings:[['training_date','Date','date',1],['facility','Facility','fac'],['facility_type','Facility type',TYPES],['district','District',DISTRICTS],['equipment','Equipment trained on','text',1],['trainees','No. of trainees','number',1],['venue','Venue','text'],['remarks','Comments / remarks','area']]
};
const QUARTERS=['First quarter','Second quarter','Third quarter','Fourth quarter'];
FIELDS.ppm_records=[['ppm_date','Date of PPM','date',1],['quarter','Quarter',QUARTERS],['facility','Facility name','fac',1],['facility_type','Facility type',TYPES],['district','District',DISTRICTS],['equipment','Equipment','text',1],['manufacturer','Manufacturer','text'],['serial_number','Serial number','text'],['work_done','Work done','area'],['next_service_date','Next servicing date','date'],['remarks','Remarks','area']];
const DATE={service_records:'date_received',trainings:'training_date',ppm_records:'ppm_date'};
const TITLES={dash:['Summary','The work done by the unit, summarized below.'],svc:['Corrective Maintenance',' Details of equipment brought in for repair.'],trn:['User Trainings','Training sessions delivered to facilities.'],ppm:['Preventive Maintenance','Planned preventive maintenance (PPM) visits and upcoming servicing dates.']};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>String(s||'').replace(/\s+/g,'-');
const Y=d=>d?+d.slice(0,4):0;
const data={service_records:[],trainings:[],ppm_records:[]};
let charts={},editing=null,tab='dash',ov='rep',VIS={m:{},sz:{}};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const COL=['#0b2e4f','#f2b134','#12a3a0','#ef6a5b','#6b5fd6','#3b82c4','#7fb069','#c2549d','#8c6d46','#2f9e6f','#d96f2b','#5b7083','#b5a000','#9b59b6'];
Chart.defaults.font.family="'DM Sans',sans-serif";Chart.defaults.color='#64748b';

async function signIn(){const {error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(error)$('lerr').textContent=error.message}
sb.auth.onAuthStateChange((_e,s)=>{$('login').classList.toggle('hide',!!s);$('app').classList.toggle('hide',!s);if(s)load()});
sb.auth.getSession().then(({data:{session}})=>{if(!session)$('login').classList.remove('hide')});

async function load(){
  const errs=[];
  for(const t of Object.keys(data)){
    const r=await sb.from(t).select('*').order(DATE[t],{ascending:false});
    if(r.error){errs.push(t+': '+r.error.message);data[t]=[]}else data[t]=r.data;
  }
  $('err').textContent=errs.length?'Some data could not be loaded ('+errs.join(' | ')+'). Run the latest SQL script in Supabase, then refresh this page.':'';
  $('err').classList.toggle('hide',!errs.length);
  data.service_records.forEach(r=>{if(r.status==='Received')r.status='Awaiting repair'});
  fillFilters();render();
}
const opts=(a,first)=>'<option value="">'+first+'</option>'+a.map(x=>`<option>${esc(x)}</option>`).join('');
function facs(){return [...new Set([...data.service_records,...data.trainings,...data.ppm_records].map(r=>(r.facility||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function known(n){n=(n||'').trim().toLowerCase();return n&&[...data.service_records,...data.trainings,...data.ppm_records].find(r=>(r.facility||'').trim().toLowerCase()===n)}
function fillFilters(){
  const ys=[...new Set([...data.service_records.map(r=>Y(r.date_received)),...data.trainings.map(r=>Y(r.training_date)),...data.ppm_records.map(r=>Y(r.ppm_date))].filter(Boolean))].sort((a,b)=>b-a);
  const keep={y:$('f_y').value,f:$('f_fac').value};
  $('f_y').innerHTML=opts(ys,'All years');$('f_y').value=keep.y;
  $('f_fac').innerHTML=opts(facs(),'All facilities');$('f_fac').value=keep.f;
  $('fac_list').innerHTML=facs().map(f=>`<option value="${esc(f)}">`).join('');
  if(!$('f_d').options.length){$('f_d').innerHTML=opts(DISTRICTS,'All districts');$('f_t').innerHTML=opts(TYPES,'All types');$('f_s').innerHTML=opts(STATUS,'All (total received)');$('f_q').innerHTML=opts(QUARTERS,'All quarters')}
}
function F(){return{y:$('f_y').value,d:$('f_d').value,t:$('f_t').value,fac:$('f_fac').value,from:$('f_from').value,to:$('f_to').value,s:$('f_s').value,q:$('f_q').value}}
function pass(t,r,skipYear){
  const f=F(),dt=r[DATE[t]];
  return (skipYear||!f.y||Y(dt)==f.y)&&(!f.d||r.district===f.d)&&(!f.t||r.facility_type===f.t)&&(!f.fac||(r.facility||'').trim()===f.fac)&&(!f.from||dt>=f.from)&&(!f.to||dt<=f.to)&&(t!=='service_records'||!f.s||r.status===f.s)&&(t!=='ppm_records'||!f.q||r.quarter===f.q);
}
const rows=t=>data[t].filter(r=>pass(t,r));
function resetF(){['f_y','f_d','f_t','f_fac','f_from','f_to','f_s','f_q'].forEach(i=>$(i).value='');render()}
document.querySelectorAll('.filters select,.filters input').forEach(e=>e.addEventListener('change',render));
document.querySelectorAll('.side nav button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll('.side nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['dash','svc','trn','ppm'].forEach(s=>$(s).classList.toggle('hide',s!==tab));
  $('f_s_wrap').classList.toggle('hide',!['dash','svc'].includes(tab));$('f_q_wrap').classList.toggle('hide',tab!=='ppm');
  $('ttl').textContent=TITLES[tab][0];$('sub').textContent=TITLES[tab][1];render();
});
$('sub').textContent=TITLES.dash[1];

function visits(){
  const m={},sz={},g={};
  data.service_records.forEach(r=>{const k=(r.serial_number||'').trim().toLowerCase();if(k)(g[k]=g[k]||[]).push(r)});
  Object.values(g).forEach(a=>{a.sort((x,y)=>(x.date_received+(x.created_at||'')).localeCompare(y.date_received+(y.created_at||'')));a.forEach((r,i)=>{m[r.id]=i+1;sz[r.id]=a.length})});
  return{m,sz};
}
function showHistory(id){
  const r=data.service_records.find(x=>x.id===id),k=(r.serial_number||'').trim().toLowerCase();
  const a=data.service_records.filter(x=>(x.serial_number||'').trim().toLowerCase()===k).sort((x,y)=>x.date_received.localeCompare(y.date_received));
  $('imp').innerHTML=`<h2 style="margin:0 0 4px">${esc(r.equipment)}, serial ${esc(r.serial_number)}</h2><p style="margin:0 0 12px;color:var(--mute)">${a.length} visits logged</p><div class="tw"><table><thead><tr><th>Visit</th><th>Received</th><th>Facility</th><th>Problem</th><th>Part replaced</th><th>Status</th><th>Dispatched</th></tr></thead><tbody>${a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.date_received)}</td><td>${esc(x.facility)}</td><td class="wrap">${esc(x.problem)}</td><td>${esc(x.part_replaced)}</td><td><span class="tag ${slug(x.status)}">${esc(x.status)}</span></td><td>${esc(x.date_dispatched)}</td></tr>`).join('')}</tbody></table></div><div class="bar" style="margin-top:12px"><button class="btn" onclick="$('imp').close()">Close</button></div>`;
  $('imp').showModal();
}
const count=(a,key)=>{const m={};a.forEach(r=>{const k=r[key]||'Not specified';m[k]=(m[k]||0)+1});return m};
function draw(id,cfg){if(charts[id])charts[id].destroy();charts[id]=new Chart($(id),cfg)}

function render(){
  VIS=visits();
  LATEST={};data.ppm_records.forEach(r=>{const k=pk(r);if(!LATEST[k]||r.ppm_date>LATEST[k])LATEST[k]=r.ppm_date});
  const sr=rows('service_records'),tr=rows('trainings'),pm=rows('ppm_records');
  if(tab==='dash')renderDash(sr,tr,pm);
  if(tab==='svc')table('svc_t','service_records',sr,['date_received','facility','facility_type','district','equipment','manufacturer','model','serial_number','visit','problem','part_replaced','status','date_dispatched','comments']);

const HDRS={};Object.keys(FIELDS).forEach(t=>HDRS[t]=Object.fromEntries(FIELDS[t].map(f=>[f[1].toLowerCase(),f[0]])));
const SHEET={service_records:'Equipment',ppm_records:'PPM'};
let FM={},pending=[],pendingT='service_records';
function cv(v){
  if(v==null)return '';
  if(v instanceof Date)return v.toISOString().slice(0,10);
  if(typeof v==='object'){
    if(v.richText)return v.richText.map(t=>t.text).join('').trim();
    if('result' in v)return cv(v.result);
    if(v.text!=null)return cv(v.text);
    return '';
  }
  return String(v).trim();
}
function okDate(y,m,d){const iso=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const t=new Date(iso+'T00:00:00Z');return !isNaN(t)&&t.toISOString().slice(0,10)===iso?iso:null}
function toISO(s){
  if(!s)return null;
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return okDate(m[1],m[2],m[3]);
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m)return okDate(m[3],m[2],m[1]);
  if(/^\d{5}$/.test(s))return new Date(Math.round((+s-25569)*864e5)).toISOString().slice(0,10);
  return null;
}
const canon=(list,v)=>list.find(x=>x.toLowerCase()===String(v).toLowerCase());
const quarterOf=iso=>QUARTERS[Math.floor((+iso.slice(5,7)-1)/3)];
function placeFields(o,rec,err){
  rec.facility_type=null;
  if(o.facility_type){rec.facility_type=canon(TYPES,o.facility_type)||null;if(!rec.facility_type)err.push(`Facility type "${o.facility_type}" is not in the list`)}
  rec.district=null;
  if(o.district){rec.district=canon(DISTRICTS,o.district)||null;if(!rec.district)err.push(`District "${o.district}" is not in the list`)}
  if(rec.facility){
    const m=known(rec.facility);
    if(m){rec.facility=m.facility.trim();rec.facility_type=rec.facility_type||m.facility_type||null;rec.district=rec.district||m.district||null}
    else{const k=rec.facility.toLowerCase();rec.facility=FM[k]||(FM[k]=rec.facility)}
  }
}
function cleanRow(t,o){
  const err=[],rec={};
  const txt=t==='ppm_records'?['facility','equipment','manufacturer','serial_number','work_done','remarks']:['facility','equipment','manufacturer','model','serial_number','problem','part_replaced','comments'];
  txt.forEach(k=>rec[k]=(o[k]||'').trim()||null);
  if(!rec.facility)err.push('Facility is missing');
  if(!rec.equipment)err.push('Equipment is missing');
  if(t==='ppm_records'){
    rec.ppm_date=toISO(o.ppm_date);
    if(!rec.ppm_date)err.push('Date of PPM is missing or not a valid date');
    rec.next_service_date=null;
    if(o.next_service_date){
      rec.next_service_date=toISO(o.next_service_date);
      if(!rec.next_service_date)err.push('Next servicing date is not a valid date');
      else if(rec.ppm_date&&rec.next_service_date<rec.ppm_date)err.push('Next servicing date is before Date of PPM');
    }
    rec.quarter=null;
    if(o.quarter){
      const w=['first','second','third','fourth'];let i=w.findIndex(x=>o.quarter.toLowerCase().includes(x));
      if(i<0){const d=o.quarter.match(/[1-4]/);i=d?+d[0]-1:-1}
      if(i<0)err.push(`Quarter "${o.quarter}" is not recognised`);else rec.quarter=QUARTERS[i];
    }else if(rec.ppm_date)rec.quarter=quarterOf(rec.ppm_date);
  }else{
    rec.date_received=toISO(o.date_received);
    if(!rec.date_received)err.push('Date received is missing or not a valid date');
    rec.date_dispatched=null;
    if(o.date_dispatched){
      rec.date_dispatched=toISO(o.date_dispatched);
      if(!rec.date_dispatched)err.push('Date dispatched is not a valid date');
      else if(rec.date_received&&rec.date_dispatched<rec.date_received)err.push('Date dispatched is before Date received');
    }
    rec.status='Awaiting repair';
    if(o.status){const s=canon(STATUS,o.status)||(o.status.toLowerCase()==='received'?'Awaiting repair':null);if(!s)err.push(`Status "${o.status}" is not in the list`);else rec.status=s}
  }
  placeFields(o,rec,err);
  return{err,rec};
}
async function pickFile(e,t='service_records'){
  const file=e.target.files[0];e.target.value='';if(!file)return;
  try{
    const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());
    const ws=wb.getWorksheet(SHEET[t])||wb.worksheets[0];
    const map={};
    ws.getRow(1).eachCell((c,n)=>{const k=HDRS[t][cv(c.value).replace(/\*/g,'').trim().toLowerCase()];if(k)map[n]=k});
    if(!Object.keys(map).length){alert('Column headings were not recognised. Please use the file from Download template.');return}
    FM={};const good=[],bad=[];
    ws.eachRow((row,i)=>{
      if(i===1)return;
      const o={};let any=false;
      for(const n in map){const v=cv(row.getCell(+n).value);if(v!=='')any=true;o[map[n]]=v}
      if(!any)return;
      const r=cleanRow(t,o);
      if(r.err.length)bad.push(`Row ${i}: ${r.err.join('; ')}`);else good.push(r.rec);
    });
    showImport(good,bad,file.name,t);
  }catch(err){alert('Could not read that file. Please use an .xlsx workbook.\n'+err.message)}
}
function showImport(good,bad,name,t){
  pending=good;pendingT=t;
  $('imp').innerHTML=`<h2 style="margin:0 0 4px">Import preview</h2><p style="margin:0 0 14px;color:var(--mute)">${esc(name)}</p>
  <div class="strip" style="margin-bottom:14px"><div><b>${good.length}</b><span>ready to import</span></div><div><b>${bad.length}</b><span>rows with problems</span></div></div>
  ${bad.length?`<div class="alert" style="max-height:200px;overflow:auto">${bad.slice(0,50).map(esc).join('<br>')}${bad.length>50?'<br>and '+(bad.length-50)+' more':''}<br><br>Rows with problems are skipped. Fix them in Excel and import again.</div>`:''}
  <div class="bar"><button class="btn gold" id="goimp" ${good.length?'':'disabled'} onclick="runImport()">Import ${good.length} records</button><button class="btn" onclick="$('imp').close()">Cancel</button></div>`;
  $('imp').showModal();
}
async function runImport(){
  const b=$('goimp');b.disabled=true;
  for(let i=0;i<pending.length;i+=200){
    b.textContent=`Importing ${Math.min(i+200,pending.length)} of ${pending.length}...`;
    const {error}=await sb.from(pendingT).insert(pending.slice(i,i+200));
    if(error){alert('Import stopped near row '+(i+1)+': '+error.message+'\nRecords before that point were saved.');break}
  }
  $('imp').close();pending=[];await load();
}

   '1. Fill in the Equipment sheet, one row per item. Columns with an asterisk (gold headings) are required.',
   '2. Pick Facility type, District and Status from the drop-down lists. Facility is typed; use the same spelling each time. Matching names are merged with facilities already in the system.',
   '3. Enter dates as dd/mm/yyyy, for example 14/03/2026. Date dispatched cannot be earlier than Date received.',
   '4. Leave Status empty to record the item as Awaiting repair.',
   '5. Do not rename the column headings. Save the file as .xlsx, then use Import from Excel in the Service log tab.',
   '6. The app shows a preview first. Rows with problems are listed and skipped; the good rows are imported.',
   '7. If equipment comes back for another repair, add it as a new row with the same serial number. Each visit is its own record.',
   '',
   'Example row: 14/03/2026 | Example Health Centre | Health Centre | Nzema East | Patient monitor | Mindray | iMEC8 | SN12345 | No display | Power board | Repaired | 20/03/2026 | Tested and working'
  ];
  lines.forEach((x,i)=>{const c=is.getCell(i+3,1);c.value=x;c.alignment={wrapText:true,vertical:'top'}});

  const ls=wb.addWorksheet('Lists',{state:'hidden'});
  ['Facility type','District','Status','Quarter'].forEach((h,i)=>ls.getCell(1,i+1).value=h);
  TYPES.forEach((v,i)=>ls.getCell(i+2,1).value=v);
  DISTRICTS.forEach((v,i)=>ls.getCell(i+2,2).value=v);
  STATUS.forEach((v,i)=>ls.getCell(i+2,3).value=v);
  QUARTERS.forEach((v,i)=>ls.getCell(i+2,4).value=v);
  const L={facility_type:`Lists!$A$2:$A$${TYPES.length+1}`,district:`Lists!$B$2:$B$${DISTRICTS.length+1}`,status:`Lists!$C$2:$C$${STATUS.length+1}`,quarter:`Lists!$D$2:$D$${QUARTERS.length+1}`};
  const D=new Date(Date.UTC(2000,0,1));
  for(let r=2;r<=501;r++)cols.forEach(([k,l,ty],i)=>{
    const c=ws.getCell(r,i+1);c.border={bottom:LINE,right:LINE};
    if(L[k])c.dataValidation={type:'list',allowBlank:true,formulae:[L[k]],showErrorMessage:true,errorTitle:l,error:'Please pick a value from the drop-down list.'};
    if(ty==='date'){c.numFmt='dd/mm/yyyy';c.dataValidation={type:'date',operator:'greaterThan',allowBlank:true,formulae:[D],showErrorMessage:true,errorTitle:l,error:'Enter a valid date, for example 14/03/2026.'}}
  });
  const buf=await wb.xlsx.writeBuffer();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=ppm?'CEU_PPM_Import_Template.xlsx':'CEU_Equipment_Import_Template.xlsx';a.click();
}

/* ---------- PPM: due dates and PDF export ---------- */
let LATEST={};
const pk=r=>(r.serial_number||'').trim().toLowerCase()||((r.facility||'')+'|'+(r.equipment||'')).trim().toLowerCase();
function dueTag(r){
  const d=r.next_service_date;if(!d)return '';
  if(r.ppm_date<LATEST[pk(r)])return esc(d);
  const today=new Date().toISOString().slice(0,10),soon=new Date(Date.now()+30*864e5).toISOString().slice(0,10);
  return d<today?`<span class="tag Beyond-repair">${esc(d)} overdue</span>`:d<=soon?`<span class="tag Awaiting-repair">${esc(d)} due soon</span>`:esc(d);
}
function exportPDF(){
  const a=rows('ppm_records'),f=F();
  if(!a.length){alert('There are no PPM records to export with the current filters.');return}
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const cols=[['ppm_date','Date of PPM'],['quarter','Quarter'],['facility','Facility'],['facility_type','Type'],['district','District'],['equipment','Equipment'],['manufacturer','Manufacturer'],['serial_number','Serial no.'],['work_done','Work done'],['next_service_date','Next servicing'],['remarks','Remarks']];
  doc.setFontSize(15);doc.setTextColor(11,46,79);doc.text('Preventive Maintenance (PPM) Report',14,14);
  doc.setFontSize(9);doc.setTextColor(100);
  const bits=[f.y&&'Year '+f.y,f.q,f.d&&'District: '+f.d,f.t&&'Facility type: '+f.t,f.fac&&'Facility: '+f.fac,f.from&&'From '+f.from,f.to&&'To '+f.to].filter(Boolean);
  doc.text('Clinical Engineering Unit, Western Region Health Directorate. '+(bits.length?bits.join(', '):'All records')+'. '+a.length+' records. Generated '+new Date().toISOString().slice(0,10)+'.',14,20);
  doc.autoTable({startY:24,head:[cols.map(c=>c[1])],body:a.map(r=>cols.map(c=>r[c[0]]??'')),styles:{fontSize:7.5,cellPadding:1.8,overflow:'linebreak'},headStyles:{fillColor:[11,46,79],textColor:255},alternateRowStyles:{fillColor:[240,245,250]},columnStyles:{8:{cellWidth:50},10:{cellWidth:34}}});
  doc.save('CEU_PPM_Report_'+new Date().toISOString().slice(0,10)+'.pdf');
}

function csv(t){
  const a=rows(t),c=FIELDS[t].map(f=>f[0]);
  const s=[FIELDS[t].map(f=>f[1]),...a.map(r=>c.map(k=>r[k]))].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));l.download=t+'_'+new Date().toISOString().slice(0,10)+'.csv';l.click();
}

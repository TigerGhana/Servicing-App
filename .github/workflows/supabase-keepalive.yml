# Keeps the CEU Service Log Supabase project from pausing after a week of inactivity.
# Save this file in your repository as: .github/workflows/supabase-keepalive.yml
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY

name: Supabase keepalive

on:
  schedule:
    - cron: '0 6 * * 1,4'   # every Monday and Thursday at 06:00 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the service log table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/service_records?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}") || code="000"
          echo "Supabase responded with HTTP ${code}"
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "Keepalive failed. The project may be paused or the secrets may be wrong."
            exit 1
          fi
